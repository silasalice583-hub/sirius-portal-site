<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章 · 天狼星门户</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-articles">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="天狼星门户首页">
        <img data-site-logo src="assets/logo-vector-web.png" alt="天狼星门户 logo" decoding="async" />
        <span data-site="brandName">天狼星门户</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="articles.html" class="active">文章</a>
        <a href="meditation.html">冥想</a>
        <a href="about.html">关于</a>
      </nav>
      <button class="music-pill" id="musicToggle" type="button" title="背景音乐">
        <span>♪</span><b>背景音乐</b>
      </button>
    </header>

    <main>
      <section class="archive-hero">
        <img class="hero-pattern-bg" id="articleBannerImage" src="assets/articles-emerald.jpg" alt="" aria-hidden="true" />
        <div class="hero-heading-copy">
          <p class="eyebrow" id="popularEyebrow">Popular</p>
          <h1 id="popularTitle">热门文章</h1>
        </div>
        <div class="lion-mermaid-stage" aria-hidden="true">
          <img src="assets/lion-mermaid.png" alt="" decoding="async" />
          <span class="mascot-ledge"></span>
        </div>
      </section>

      <section class="hot-showcase" id="popular">
        <div class="hot-carousel-wrap">
          <button class="hot-arrow hot-prev" id="hotPrev" type="button" aria-label="上一篇热门文章">‹</button>
          <div class="hot-carousel" id="hotCarousel"></div>
          <button class="hot-arrow hot-next" id="hotNext" type="button" aria-label="下一篇热门文章">›</button>
        </div>
        <div class="hot-dots" id="hotDots"></div>
      </section>

      <section class="article-area article-band" id="articles">
        <div class="section-head">
          <div>
            <p class="eyebrow" id="latestEyebrow">Latest Articles</p>
            <h2 id="listTitle">全部文章</h2>
          </div>
          <span id="articleCount"></span>
        </div>
        <div class="article-filter-row">
          <div class="category-tabs" id="categoryList"></div>
          <input id="articleSearchInput" class="inline-search" type="search" placeholder="搜索标题或正文" />
        </div>
        <div class="sort-row">
          <label>排序
            <select id="sortSelect">
              <option value="newest">按时间：最新优先</option>
              <option value="oldest">按时间：最早优先</option>
            </select>
          </label>
        </div>
        <div class="article-grid article-list" id="articleGrid"></div>
        <div class="pagination" id="pagination"></div>
      </section>

      <article class="reader" id="reader" hidden>
        <button class="back-button" id="backButton" type="button">返回文章列表</button>
        <div class="reader-hero">
          <img id="readerCover" alt="" />
          <div>
            <p class="eyebrow" id="readerMeta"></p>
            <h2 id="readerTitle"></h2>
            <p id="readerExcerpt"></p>
          </div>
        </div>
        <div id="inlineMusic"></div>
        <div class="reader-body" id="readerBody"></div>
        <section class="comments" id="comments"></section>
      </article>
    </main>

    <audio id="backgroundAudio" preload="none"></audio>
    <script src="articles-data.js"></script>
    <script src="config.js"></script>
    <script src="api-client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
